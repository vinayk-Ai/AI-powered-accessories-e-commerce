<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 200" width="100%" height="100%">
  <defs>
    <!-- Smooth gradient for the upward arrow stem -->
    <linearGradient id="arrow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f3057" />
      <stop offset="40%" stop-color="#00897b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Drop shadow for clean web presentation -->
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b192c" flood-opacity="0.08" />
    </filter>
  </defs>

  <g filter="url(#subtle-shadow)">
    <!-- Stacked Green Blocks (Height and spacing perfectly aligned to main 'B' stem: y=45 to 165) -->
    <rect x="20" y="45" width="32" height="36" rx="6" fill="#10b981" />
    <rect x="20" y="87" width="32" height="36" rx="6" fill="#10b981" />
    <rect x="20" y="129" width="32" height="36" rx="6" fill="#10b981" />

    <!-- Main Navy 'B' Structure -->
    <path d="
      M 58,45 
      H 110 
      C 132,45 146,56 146,73 
      C 146,86 136,96 122,99 
      C 140,103 152,115 152,132 
      C 152,151 135,165 110,165 
      H 58 
      Z
      M 84,68 
      V 92 
      H 108 
      C 116,92 121,87 121,80 
      C 121,73 116,68 108,68 
      Z
      M 84,114 
      V 142 
      H 110 
      C 119,142 125,136 125,128 
      C 125,120 119,114 110,114 
      Z" fill="#172b4d" fill-rule="evenodd" />

    <!-- Upward Growth Arrow Integrated into the 'B' Center -->
    <path d="
      M 74,116 
      C 95,116 110,106 128,84 
      L 142,67 
      L 130,65 
      L 166,42 
      L 162,78 
      L 152,66 
      L 138,82 
      C 118,107 98,126 74,126 
      Z" fill="url(#arrow-grad)" />
  </g>
</svg>